name: Shorebird Release Android

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Shorebird Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Shorebird
        uses: shorebirdtech/actions/setup-shorebird@v1
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Install Dependencies
        run: shorebird flutter pub get

      - name: Run Tests
        run: shorebird flutter test

      - name: Shorebird Release Android APK
        run: shorebird release android --artifact=apk --no-confirm

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ryve-shorebird-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
