name: Shorebird Patch Android

on:
  workflow_dispatch:

jobs:
  patch:
    name: Build & Deploy Shorebird Patch (Over-The-Air)
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Shorebird Patch Android
        run: shorebird patch android -- --no-tree-shake-icons --android-skip-build-dependency-validation
